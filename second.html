<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maybe Next Time</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a8b7d1 0%, #8e9aaf 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-100px) translateX(50px);
                opacity: 0.6;
            }
        }

        .container {
            text-align: center;
            padding: 60px 80px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 600px;
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 300;
            color: #2d3436;
            margin-bottom: 20px;
            letter-spacing: 2px;
            line-height: 1.3;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #a8b7d1, #8e9aaf);
            margin: 30px auto;
        }

        p {
            font-size: 1.1rem;
            color: #636e72;
            margin: 20px 0;
            font-weight: 300;
            line-height: 1.8;
        }

        .heart {
            width: 80px;
            height: 80px;
            margin: 30px auto;
            position: relative;
            opacity: 0.4;
            filter: grayscale(50%);
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 65px;
            background: linear-gradient(135deg, #a8b7d1, #8e9aaf);
            border-radius: 40px 40px 0 0;
        }

        .heart::before {
            left: 40px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .back-btn {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid #a8b7d1;
            background: white;
            color: #636e72;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #a8b7d1 0%, #8e9aaf 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                margin: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        
        <h1>As expected</h1>
        <div class="divider"></div>
        <p>jangli suar khai ki </p>
        <a href="index.html" class="back-btn">ha  kar deeeeee</a>
    </div>
</body>
</html>
