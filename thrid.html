<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Said Yes!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 60px 80px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gif-container {
            margin: 30px 0;
            width: 100%;
            max-width: 400px;
            height: 300px;
            background: #f8f9fa;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .gif-placeholder {
            color: #999;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            color: #2d3436;
            margin: 20px 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #b6c1f5, #764ba2);
            margin: 30px auto;
        }

        .gif-container {
            margin: 30px 0;
            width: 100%;
            max-width: 400px;
            height: 300px;
            background: #f8f9fa;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }

        .gif-placeholder {
            color: #999;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
        }

        p {
            font-size: 1.1rem;
            color: #636e72;
            margin-top: 20px;
            font-weight: 300;
            line-height: 1.8;
            max-width: 500px;
        }

        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            position: absolute;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                margin: 20px;
            }
            
            h2 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Impossible</h2>
        <div class="divider"></div>
        
        <!-- GIF Section -->
        <div class="gif-container">
            <!-- Replace the src with your GIF URL -->
            <img src="1.gif" alt="Celebration" onerror="this.parentElement.innerHTML='<div class=\'gif-placeholder\'>Add your GIF URL here</div>'">
        </div>
        
        <!-- Paragraph Section -->
        <p>haa kese kar diya ho hi nai sakta ye to me mann hi nai sakta </p>
    </div>

    <script>
        // Create confetti on page load
        for (let i = 0; i < 150; i++) {
            setTimeout(() => {
                createConfetti();
            }, i * 20);
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * window.innerWidth + 'px';
            confetti.style.top = '-10px';
            
            const colors = ['#f120ce', '#ff11cb', '#f093fb', '#f5576c', '#b6c1f5', '#764ba2'];
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            
            document.body.appendChild(confetti);
            
            setTimeout(() => confetti.remove(), 3000);
        }
    </script>
</body>
</html>
